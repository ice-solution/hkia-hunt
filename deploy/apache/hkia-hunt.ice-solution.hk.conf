# Cloudflare Flexible SSL + Apache2 reverse proxy
# Client --HTTPS--> Cloudflare --HTTP:80--> Apache --proxy--> Node (127.0.0.1:3000)
#
# Requires:
#   sudo a2enmod proxy proxy_http headers rewrite remoteip
#   sudo cp deploy/apache/hkia-hunt.ice-solution.hk.conf /etc/apache2/sites-available/
#   sudo a2ensite hkia-hunt.ice-solution.hk.conf
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Cloudflare DNS: A/AAAA for hkia-hunt.ice-solution.hk → origin IP (Proxied/orange cloud)
# SSL/TLS mode: Flexible
#
# Adjust ProxyPass port if PORT in .env is not 3000.

<VirtualHost *:80>
    ServerName hkia-hunt.ice-solution.hk
    ServerAdmin webmaster@ice-solution.hk

    ErrorLog ${APACHE_LOG_DIR}/hkia-hunt-error.log
    CustomLog ${APACHE_LOG_DIR}/hkia-hunt-access.log combined

    # Restore visitor IP from Cloudflare
    RemoteIPHeader CF-Connecting-IP
    RemoteIPTrustedProxy 173.245.48.0/20
    RemoteIPTrustedProxy 103.21.244.0/22
    RemoteIPTrustedProxy 103.22.200.0/22
    RemoteIPTrustedProxy 103.31.4.0/22
    RemoteIPTrustedProxy 141.101.64.0/18
    RemoteIPTrustedProxy 108.162.192.0/18
    RemoteIPTrustedProxy 190.93.240.0/20
    RemoteIPTrustedProxy 188.114.96.0/20
    RemoteIPTrustedProxy 197.234.240.0/22
    RemoteIPTrustedProxy 198.41.128.0/17
    RemoteIPTrustedProxy 162.158.0.0/15
    RemoteIPTrustedProxy 104.16.0.0/13
    RemoteIPTrustedProxy 104.24.0.0/14
    RemoteIPTrustedProxy 172.64.0.0/13
    RemoteIPTrustedProxy 131.0.72.0/22
    RemoteIPTrustedProxy 2400:cb00::/32
    RemoteIPTrustedProxy 2606:4700::/32
    RemoteIPTrustedProxy 2803:f800::/32
    RemoteIPTrustedProxy 2405:b500::/32
    RemoteIPTrustedProxy 2405:8100::/32
    RemoteIPTrustedProxy 2a06:98c0::/29
    RemoteIPTrustedProxy 2c0f:f248::/32

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 60

    # Tell Node the original scheme (visitor used HTTPS via Cloudflare)
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    <Proxy *>
        Require all granted
    </Proxy>

    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    # Optional: block direct probing of common junk paths at Apache layer
    # RedirectMatch 404 /\.git
</VirtualHost>
